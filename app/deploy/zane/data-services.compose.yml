version: "3.8"

x-zane-env:
  ONTOS_ADMIN_PASSWORD: "{{ generate_password | 64 }}"
  ONTOS_RUNTIME_PASSWORD: "{{ generate_password | 64 }}"
  ONTOS_DATABASE_HOST: "{{ network_alias | 'postgres' }}"
  SPICEDB_DATABASE_PASSWORD: "{{ generate_password | 64 }}"
  SPICEDB_DATABASE_HOST: "{{ network_alias | 'spicedb-postgres' }}"
  __DATABASE_ADMIN_URL: "postgresql://ontos_admin:${ONTOS_ADMIN_PASSWORD}@${ONTOS_DATABASE_HOST}:5432/ontos"
  __DATABASE_URL: "postgresql://ontos_runtime:${ONTOS_RUNTIME_PASSWORD}@${ONTOS_DATABASE_HOST}:5432/ontos"
  __SPICEDB_DATASTORE_CONN_URI: "postgresql://spicedb:${SPICEDB_DATABASE_PASSWORD}@${SPICEDB_DATABASE_HOST}:5432/spicedb?sslmode=disable"

services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine
    environment:
      POSTGRES_DB: ontos
      POSTGRES_PASSWORD: ${ONTOS_ADMIN_PASSWORD}
      POSTGRES_USER: ontos_admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontos_admin -d ontos"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ontos-data:/var/lib/postgresql
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  spicedb-postgres:
    image: docker.io/library/postgres:18.6-alpine
    environment:
      POSTGRES_DB: spicedb
      POSTGRES_PASSWORD: ${SPICEDB_DATABASE_PASSWORD}
      POSTGRES_USER: spicedb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spicedb -d spicedb"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - spicedb-data:/var/lib/postgresql
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  ontos-data:
  spicedb-data:
